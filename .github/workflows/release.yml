name: Release

# Pushing a `vX.Y.Z` tag publishes a GitHub release whose notes are the `## X.Y.Z (date)` section
# of CHANGELOG.md; a missing or empty section fails the run instead of publishing. A push to the
# default branch that changes CHANGELOG.md rewrites the notes of every release whose section changed.
on:
  push:
    tags: ["v*"]
    # GitHub skips path filters for tag pushes, so this limits only branch pushes.
    branches: [master]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  # The Linux and macOS test suites from tests.yml: only a passing tag is published.
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/tests.yml

  publish:
    if: github.ref_type == 'tag'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no notes under '## $v'"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REPOSITORY#*/} $v" --notes-file notes.md --verify-tag

  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match release notes to CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        # Explicit bash adds pipefail: a failed `gh release list` fails the job instead of syncing nothing.
        shell: bash
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r tag; do
            v="${tag#v}"
            awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
            grep -q '[^[:space:]]' notes.md || continue
            # An assignment, so a failed lookup stops the job instead of counting as changed notes.
            current=$(gh release view "$tag" --json body -q .body)
            if [ "$current" != "$(cat notes.md)" ]; then
              gh release edit "$tag" --notes-file notes.md
              echo "updated $tag"
            fi
          done

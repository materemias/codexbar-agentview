name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Arch matches the target desktop: current Qt 6, its qml tool and
    # Kirigami, so the QML tests run instead of skipping; bun runs the omp
    # extension's tests and luau the Tern plugin's.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake python qt6-declarative kirigami git bun luau
      - uses: actions/checkout@v7
      - name: Compile the Tern plugin
        run: luau-compile --null tern/host.luau tern/window.luau
      - name: Build native package
        run: |
          cmake -S . -B build -DCODEXBAR_BUILD_TESTS=ON
          cmake --build build
      - name: Native tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile contents/scripts/*.py
          python tests/run.py -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python and Darwin bridge tests
        run: |
          python -m py_compile contents/scripts/*.py
          python tests/run.py -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python tests
        shell: pwsh
        run: |
          python -m py_compile (Get-ChildItem contents/scripts/*.py).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/run.py -v
